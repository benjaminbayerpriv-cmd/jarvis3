<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Jarvis Manager</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#131314;color:#e9e9eb}body{max-width:1050px;margin:auto;padding:32px}h1{margin-bottom:6px}p{color:#b7b8bd}section{background:#202124;border:1px solid #34363b;border-radius:16px;padding:20px;margin:18px 0}.row{display:flex;gap:10px;flex-wrap:wrap}button,a{background:#30343a;color:#f4f5f8;border:0;border-radius:9px;padding:11px 16px;font:inherit;cursor:pointer;text-decoration:none}button:hover,a:hover{background:#444951}.primary{background:#a9c7ff;color:#12294c}pre{white-space:pre-wrap;overflow:auto;max-height:45vh;font:12px/1.5 ui-monospace,monospace;color:#c8c9ce}#notice{min-height:1.5em;color:#b6d0ff}</style></head><body>
<h1>Jarvis Manager</h1><p>Start, Voraussetzungen und Protokolle an einem Ort.</p><section><h2>Status</h2><p id="status">Status wird geladen …</p><div class="row"><button class="primary" data-action="start">Jarvis starten</button><button data-action="stop">Jarvis beenden</button><a href="http://127.0.0.1:7777/app/" target="_blank" rel="noopener">Jarvis öffnen</a><button data-action="install">Voraussetzungen installieren</button></div><p id="notice" role="status"></p></section><section><div class="row"><h2>Protokoll</h2><button id="refresh">Aktualisieren</button></div><pre id="log">Wird geladen …</pre></section><script>
let token='';const status=document.querySelector('#status'),notice=document.querySelector('#notice'),log=document.querySelector('#log');async function get(path){const r=await fetch(path);if(!r.ok)throw Error('Manager nicht erreichbar');return r.json()}async function update(){try{let s=await get('/api/status');status.textContent=`Jarvis: ${s.health?'läuft':'aus'} · Sprache: ${s.speech?'bereit':'nicht bereit'} · Bun: ${s.bun?'vorhanden':'fehlt'} · uv: ${s.uv?'vorhanden':'fehlt'} · OpenCode: ${s.opencode?'vorhanden':'fehlt'}${s.job?' · Installation läuft':''}`}catch(e){status.textContent=e.message}}async function logs(){try{log.textContent=(await get('/api/logs')).text}catch(e){log.textContent=e.message}}document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await fetch('/api/'+b.dataset.action,{method:'POST',headers:{'X-Jarvis-Token':token}}),j=await r.json();notice.textContent=j.message||j.error;await update()}catch(e){notice.textContent=e.message}finally{b.disabled=false}});document.querySelector('#refresh').onclick=logs;(async()=>{token=(await get('/api/token')).token;await update();await logs()})();setInterval(update,3000);
</script></body></html>

<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101419">
  <title>Jarvis</title>
  <link rel="stylesheet" href="/mobile.css">
  <script type="module" src="/mobile.js"></script>
</head>
<body>
  <main>
    <section id="welcome" class="welcome" aria-labelledby="app-title">
      <img class="logo" src="/app/icons/jarvis-512.png" width="64" height="64" alt="">
      <h1 id="app-title">Jarvis</h1>
      <p>Dein Assistent im lokalen Netz.</p>
      <a id="download" class="primary" href="/download/Jarvis.apk" download hidden>Android-App herunterladen</a>
      <p id="downloadStatus" role="status"></p>
      <button id="continue">Im Browser weiter</button>
    </section>

    <section id="pair" class="welcome" hidden>
      <h1>Handy koppeln</h1>
      <p>Öffne auf dem Computer in Jarvis die Einstellungen und wähle „Gerät koppeln“.</p>
      <form id="pairForm">
        <label for="pin">Kopplungs-PIN</label>
        <input id="pin" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
        <button class="primary">Koppeln</button>
      </form>
      <p id="pairStatus" role="status"></p>
    </section>

  </main>
</body>
</html>
